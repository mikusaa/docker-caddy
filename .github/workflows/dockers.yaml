name: Build Docker Image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current Caddy release even if its tags exist
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-release
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: mikusa/caddy
  GHCR_IMAGE: ghcr.io/mikusaa/caddy

jobs:
  build:
    name: Build and push Caddy
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest Caddy release
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Caddy release tag: ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mikusa
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Check published version
        id: published
        env:
          VERSION: ${{ steps.caddy.outputs.version }}
          FORCE_REBUILD: ${{ inputs.force || false }}
        run: |
          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          dockerhub_exists=false
          ghcr_exists=false
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" >/dev/null 2>&1 && dockerhub_exists=true
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" >/dev/null 2>&1 && ghcr_exists=true

          if [[ "${dockerhub_exists}" == "true" && "${ghcr_exists}" == "true" ]]; then
            echo "Caddy ${VERSION} is already published to both registries."
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Caddy ${VERSION} needs to be published."
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.published.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Build and push
        if: steps.published.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.caddy.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.caddy.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
